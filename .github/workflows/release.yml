name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # ─── Validate versions match the tag ───
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag format and version consistency
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $GITHUB_REF_NAME (expected vX.Y.Z)"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")

          MISMATCH=0
          for NAME_VER in "package.json:$PKG_VERSION" "Cargo.toml:$CARGO_VERSION" "tauri.conf.json:$TAURI_VERSION"; do
            NAME="${NAME_VER%%:*}"
            VER="${NAME_VER##*:}"
            if [ "$VER" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch: $NAME has $VER, tag is $TAG_VERSION"
              MISMATCH=1
            fi
          done

          [ "$MISMATCH" -eq 0 ] || exit 1
          echo "All versions match: $TAG_VERSION"

  # ─── Run tests ───
  test:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run JS tests
        run: npm test

  # ─── Build per architecture ───
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build-${{ matrix.arch }}

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Grammalecte download
        uses: actions/cache@v5
        with:
          path: .tmp-build
          key: grammalecte-${{ hashFiles('scripts/build-assets.sh') }}

      - name: Build assets (Grammalecte)
        run: ./scripts/build-assets.sh

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"

          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg 2>/dev/null | head -1)

          if [ ! -f "$DMG" ]; then
            echo "::error::DMG not found for ${{ matrix.target }}"
            exit 1
          fi

          ARTIFACT="azeTextCorrector_${VERSION}_${{ matrix.arch }}.dmg"
          cp "$DMG" "$ARTIFACT"

          echo "Built: $ARTIFACT ($(du -sh "$ARTIFACT" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dmg-${{ matrix.arch }}
          path: azeTextCorrector_*.dmg
          retention-days: 5

  # ─── Collect and publish release ───
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dmg-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          shasum -a 256 azeTextCorrector_*.dmg > SHA256SUMS.txt
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Installation

            | Architecture | Fichier |
            |---|---|
            | Apple Silicon (M1/M2/M3/M4) | `azeTextCorrector_*_aarch64.dmg` |
            | Intel | `azeTextCorrector_*_x86_64.dmg` |

            > **macOS Gatekeeper** : L'app n'est pas signée par un certificat Apple Developer.
            > Au premier lancement, faire **clic droit > Ouvrir** sur l'app, puis confirmer.
            > Sinon en terminal : `xattr -cr /Applications/azeTextCorrector.app`
          files: |
            azeTextCorrector_*.dmg
            SHA256SUMS.txt
          fail_on_unmatched_files: true
