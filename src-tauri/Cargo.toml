[package]
name = "azetextcorrector"
version = "1.0.0"
description = "Application native macOS de correction orthographique et grammaticale française"
authors = ["azeTextCorrector"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# Async runtime
tokio = { version = "1", features = ["process", "time", "sync"] }

# HTTP client for LanguageTool API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
thiserror = "2.0"

# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
