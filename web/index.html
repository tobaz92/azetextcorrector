<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>azeTextCorrector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-tauri-drag-region>
    <span class="app-title" data-tauri-drag-region>azeTextCorrector</span>
    <div class="header-actions">
      <button id="toggle-dictionary" class="icon-btn" title="Dictionnaire (⌘D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div class="editor">
      <!-- PANE INPUT -->
      <div class="pane pane-input">
        <div class="pane-header">
          <span class="pane-label">Texte original</span>
          <button class="icon-btn" id="clear-input" title="Effacer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <textarea
          id="input"
          class="editor-textarea"
          placeholder="Collez ou saisissez votre texte ici..."
          spellcheck="false"
          autofocus
          aria-label="Texte à corriger"
          aria-describedby="input-hint"
        ></textarea>
        <span id="input-hint" class="sr-only">
          Saisissez le texte à corriger, puis appuyez sur Commande+Entrée
        </span>
      </div>

      <!-- PANE OUTPUT -->
      <div class="pane pane-output">
        <div class="pane-header">
          <span class="pane-label">Texte corrigé</span>
          <button class="icon-btn" id="copy-output" title="Copier (⌘⇧C)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        <div class="output-wrapper">
          <div
            id="output"
            class="output-content"
            role="region"
            aria-label="Texte corrigé"
            aria-live="polite"
          ></div>
          <div id="output-placeholder" class="placeholder">
            Le résultat apparaîtra ici...
          </div>

          <!-- Loading overlay -->
          <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-content">
              <div class="spinner"></div>
              <div class="loading-message" id="loading-message">Correction...</div>
            </div>
          </div>

          <!-- Error state -->
          <div id="error-state" class="error-state hidden">
            <div class="error-icon">⚠</div>
            <div class="error-title">Erreur</div>
            <div class="error-message" id="error-message">Une erreur s'est produite.</div>
            <button class="btn" id="retry-btn">Réessayer</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer data-tauri-drag-region>
    <div class="footer-left">
      <span class="status" id="status" role="status" aria-live="polite">prêt</span>
      <span class="char-count" id="char-count"></span>
    </div>
    <div class="shortcuts">
      <span><kbd>⌘↵</kbd> corriger</span>
      <span><kbd>⌘⇧C</kbd> copier</span>
      <span><kbd>⌘D</kbd> dictionnaire</span>
    </div>
  </footer>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu hidden" role="menu" aria-label="Actions">
    <div id="context-suggestions" class="context-suggestions hidden"></div>
    <button class="context-item" data-action="ignore" role="menuitem">
      <svg class="context-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Ignorer ce mot</span>
      <kbd>i</kbd>
    </button>
    <button class="context-item" data-action="revert" role="menuitem">
      <svg class="context-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      <span>Annuler la correction</span>
      <kbd>r</kbd>
    </button>
    <div class="context-divider"></div>
    <button class="context-item" data-action="copy" role="menuitem">
      <svg class="context-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copier</span>
      <kbd>⌘C</kbd>
    </button>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Dictionary panel -->
  <aside id="dictionary-panel" class="panel hidden">
    <header class="panel-header">
      <h2>Dictionnaire</h2>
      <button id="close-panel" class="icon-btn" title="Fermer (Escape)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <div class="panel-content">
      <div class="add-word">
        <input type="text" id="new-word" placeholder="Ajouter un mot..." maxlength="100">
        <button id="add-word-btn" class="btn-icon" title="Ajouter">+</button>
      </div>

      <ul id="word-list" class="word-list"></ul>
    </div>

    <footer class="panel-footer">
      <span id="word-count">0 mots</span>
    </footer>
  </aside>

  <script src="corrector.js" defer></script>
  <!-- Classic scripts sharing one global scope: order matters, main.js last -->
  <script src="app/core.js" defer></script>
  <script src="app/feedback.js" defer></script>
  <script src="app/correction-renderer.js" defer></script>
  <script src="app/context-menu.js" defer></script>
  <script src="app/dictionary.js" defer></script>
  <script src="app/editor.js" defer></script>
  <script src="app/main.js" defer></script>
</body>
</html>
